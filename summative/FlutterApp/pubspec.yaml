name: food_price_app
description: One-page Flutter app that predicts the retail price per kg of a food item in Rwanda by calling a FastAPI service.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <5.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
